[package]
name = "mini_block"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
p256 = { version = "0.14.0", features = ["ecdsa", "arithmetic"] }
rand = "0.10.2"
rand_core = "0.10.1"
sha2 = "0.11.0"
ripemd160="0.9"
bs58= "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
env_logger = "0.11.11"
log = "0.4.34"
actix-web = "4.15.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }

[dev-dependencies]
actix-http = "3.18"
